<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Avatar: Kim (Top player - green aura character with golden ring) -->
  <defs>
    <!-- Anneau d'or métallique -->
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="25%" stop-color="#d8a644"/>
      <stop offset="60%" stop-color="#946519"/>
      <stop offset="85%" stop-color="#f5cf73"/>
      <stop offset="100%" stop-color="#5a3809"/>
    </linearGradient>

    <!-- Fond émeraude / aura verte -->
    <radialGradient id="greenAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#b4f7a6"/>
      <stop offset="35%" stop-color="#4fd66b"/>
      <stop offset="70%" stop-color="#1f7a3a"/>
      <stop offset="100%" stop-color="#0c3d1a"/>
    </radialGradient>
  </defs>

  <!-- Anneau extérieur or -->
  <circle cx="50" cy="50" r="48" fill="url(#goldRim)"/>
  <circle cx="50" cy="50" r="44" fill="#2d1d08"/>
  <circle cx="50" cy="50" r="42" fill="url(#greenAura)"/>

  <!-- Silhouette / portrait Kim avec halo vert -->
  <!-- Buste -->
  <path d="M 24 88 C 24 66 36 62 44 60 C 44 60 40 56 40 48 C 40 48 35 48 34 42 C 33 36 37 36 37 36 C 35 28 40 20 48 20 C 58 20 63 26 63 36 C 66 36 67 40 66 44 C 65 48 60 48 60 48 C 60 56 56 60 56 60 C 64 62 76 66 76 88 Z"
        fill="#124622" opacity="0.6"/>

  <!-- Tête et cheveux stylisés avec lumière verte -->
  <circle cx="50" cy="38" r="14" fill="#a8f29d"/>
  <!-- Cheveux modernes -->
  <path d="M 37 36 C 36 24 44 18 52 18 C 62 18 65 25 64 34 C 58 31 52 30 46 32 C 40 34 38 36 37 36 Z" fill="#256b37"/>
  <!-- Cou et épaules -->
  <path d="M 44 50 L 56 50 L 58 60 L 42 60 Z" fill="#88e07a"/>
  <!-- Veste / col montant -->
  <path d="M 28 84 C 30 68 40 62 50 62 C 60 62 70 68 72 84 Z" fill="#1b5a2e"/>
  <path d="M 44 62 L 50 74 L 56 62 Z" fill="#4ade80"/>

  <!-- Éclat doré sur l'anneau -->
  <ellipse cx="28" cy="24" rx="8" ry="3" transform="rotate(-40 28 24)" fill="#ffffff" opacity="0.45"/>
</svg>
