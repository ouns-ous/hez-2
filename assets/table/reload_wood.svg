<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Bouton Rejouer / Nouvelle partie en bois et or -->
  <defs>
    <linearGradient id="woodReloadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5327"/>
      <stop offset="35%" stop-color="#693c18"/>
      <stop offset="70%" stop-color="#552f11"/>
      <stop offset="100%" stop-color="#3b1d06"/>
    </linearGradient>

    <linearGradient id="goldReloadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5cf"/>
      <stop offset="30%" stop-color="#f5cd69"/>
      <stop offset="70%" stop-color="#b8832a"/>
      <stop offset="100%" stop-color="#6e4609"/>
    </linearGradient>

    <filter id="reloadShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Plaque carrée en bois aux coins arrondis -->
  <rect x="3" y="3" width="54" height="54" rx="11" fill="url(#woodReloadGrad)" stroke="url(#goldReloadGrad)" stroke-width="2.5" filter="url(#reloadShadow)"/>
  <rect x="6" y="6" width="48" height="48" rx="8" fill="none" stroke="#2a1405" stroke-width="1.2" opacity="0.6"/>

  <!-- 4 petits rivets dorés aux coins -->
  <circle cx="9" cy="9" r="2" fill="url(#goldReloadGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="51" cy="9" r="2" fill="url(#goldReloadGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="9" cy="51" r="2" fill="url(#goldReloadGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="51" cy="51" r="2" fill="url(#goldReloadGrad)" stroke="#381d06" stroke-width="0.8"/>

  <!-- Flèches circulaires dorées au centre -->
  <g transform="translate(30, 30)">
    <!-- Arc du haut (sens horaire) -->
    <path d="M -11 -2 A 13 13 0 0 1 11 -2" fill="none" stroke="url(#goldReloadGrad)" stroke-width="3.6" stroke-linecap="round"/>
    <!-- Pointe de flèche haut-droite -->
    <path d="M 8 -8 L 15 -2 L 7 1 Z" fill="url(#goldReloadGrad)" stroke="#452706" stroke-width="1"/>

    <!-- Arc du bas (sens horaire) -->
    <path d="M 11 2 A 13 13 0 0 1 -11 2" fill="none" stroke="url(#goldReloadGrad)" stroke-width="3.6" stroke-linecap="round"/>
    <!-- Pointe de flèche bas-gauche -->
    <path d="M -8 8 L -15 2 L -7 -1 Z" fill="url(#goldReloadGrad)" stroke="#452706" stroke-width="1"/>

    <!-- Étoile centrale marocaine à 4 branches -->
    <path d="M 0 -4 L 1.2 -1.2 L 4 0 L 1.2 1.2 L 0 4 L -1.2 1.2 L -4 0 L -1.2 -1.2 Z" fill="url(#goldReloadGrad)" stroke="#452706" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="1.1" fill="#301705"/>
  </g>
</svg>
