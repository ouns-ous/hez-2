<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Bouton Journal / Historique en bois et or (parchemin / سجل) -->
  <defs>
    <linearGradient id="woodLogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5327"/>
      <stop offset="35%" stop-color="#693c18"/>
      <stop offset="70%" stop-color="#552f11"/>
      <stop offset="100%" stop-color="#3b1d06"/>
    </linearGradient>

    <linearGradient id="goldLogGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5cf"/>
      <stop offset="30%" stop-color="#f5cd69"/>
      <stop offset="70%" stop-color="#b8832a"/>
      <stop offset="100%" stop-color="#6e4609"/>
    </linearGradient>

    <linearGradient id="parchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaea"/>
      <stop offset="50%" stop-color="#f5e5be"/>
      <stop offset="100%" stop-color="#e3cb98"/>
    </linearGradient>

    <filter id="logShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Plaque carrée en bois aux coins arrondis -->
  <rect x="3" y="3" width="54" height="54" rx="11" fill="url(#woodLogGrad)" stroke="url(#goldLogGrad)" stroke-width="2.5" filter="url(#logShadow)"/>
  <rect x="6" y="6" width="48" height="48" rx="8" fill="none" stroke="#2a1405" stroke-width="1.2" opacity="0.6"/>

  <!-- 4 petits rivets dorés aux coins -->
  <circle cx="9" cy="9" r="2" fill="url(#goldLogGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="51" cy="9" r="2" fill="url(#goldLogGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="9" cy="51" r="2" fill="url(#goldLogGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="51" cy="51" r="2" fill="url(#goldLogGrad)" stroke="#381d06" stroke-width="0.8"/>

  <!-- Parchemin / manuscrit au centre -->
  <g transform="translate(30, 30)">
    <!-- Feuille de parchemin déroulée -->
    <path d="M-11 -13 C-11 -13 -6 -11 0 -13 C6 -15 11 -13 11 -13 L11 13 C11 13 6 15 0 13 C-6 11 -11 13 -11 13 Z" fill="url(#goldLogGrad)" stroke="#452706" stroke-width="1.2"/>
    <path d="M-9 -11 C-9 -11 -5 -9.5 0 -11 C5 -12.5 9 -11 9 -11 L9 11 C9 11 5 12.5 0 11 C-5 9.5 -9 11 -9 11 Z" fill="url(#parchGrad)" opacity="0.95"/>

    <!-- Lignes de texte écrites sur le manuscrit -->
    <line x1="-6.5" y1="-6" x2="6.5" y2="-6" stroke="#5a310c" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-6.5" y1="-1" x2="6.5" y2="-1" stroke="#5a310c" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-6.5" y1="4" x2="4" y2="4" stroke="#5a310c" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Sceau de cire rouge marocain avec bordure or -->
    <circle cx="4.5" cy="8.5" r="3.2" fill="#ab2618" stroke="#452706" stroke-width="0.8"/>
    <circle cx="4.5" cy="8.5" r="1.5" fill="url(#goldLogGrad)"/>

    <!-- Enroulement supérieur (cylindre) -->
    <path d="M-12.5 -13.5 C-12.5 -16 -9.5 -16 0 -16 C9.5 -16 12.5 -16 12.5 -13.5 C12.5 -11.5 9.5 -11.5 0 -11.5 C-9.5 -11.5 -12.5 -11.5 -12.5 -13.5 Z" fill="url(#goldLogGrad)" stroke="#452706" stroke-width="1"/>

    <!-- Enroulement inférieur (cylindre) -->
    <path d="M-12.5 13.5 C-12.5 11.5 -9.5 11.5 0 11.5 C9.5 11.5 12.5 11.5 12.5 13.5 C12.5 16 9.5 16 0 16 C-9.5 16 -12.5 16 -12.5 13.5 Z" fill="url(#goldLogGrad)" stroke="#452706" stroke-width="1"/>
  </g>
</svg>
