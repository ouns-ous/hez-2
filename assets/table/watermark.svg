<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- Motif arabesque marocain en filigrane (centre du tapis) -->
  <defs>
    <g id="petalBranch">
      <!-- Branche florale s'étendant depuis le centre -->
      <path d="M 200 160 C 185 130 180 100 200 60 C 220 100 215 130 200 160 Z"
            fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
      <path d="M 200 145 C 190 120 170 105 160 90 C 180 95 192 110 200 135"
            stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" fill="none"/>
      <path d="M 200 145 C 210 120 230 105 240 90 C 220 95 208 110 200 135"
            stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" fill="none"/>
      <circle cx="200" cy="52" r="4" fill="#ffffff" fill-opacity="0.07"/>
    </g>
  </defs>

  <!-- Losange central gravé -->
  <polygon points="200,165 235,200 200,235 165,200"
           fill="#0b363d" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <polygon points="200,175 225,200 200,225 175,200"
           fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Les 4 branches florales rayonnantes -->
  <!-- Haut -->
  <use href="#petalBranch"/>

  <!-- Droite -->
  <g transform="rotate(90 200 200)">
    <use href="#petalBranch"/>
  </g>

  <!-- Bas -->
  <g transform="rotate(180 200 200)">
    <use href="#petalBranch"/>
  </g>

  <!-- Gauche -->
  <g transform="rotate(270 200 200)">
    <use href="#petalBranch"/>
  </g>

  <!-- Éléments d'angle diagonaux -->
  <g transform="rotate(45 200 200)">
    <circle cx="200" cy="115" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="200" cy="285" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="115" cy="200" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle cx="285" cy="200" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  </g>
</svg>
