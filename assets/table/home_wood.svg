<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Bouton Accueil en bois et or (style riad marocain) -->
  <defs>
    <linearGradient id="woodHomeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5327"/>
      <stop offset="35%" stop-color="#693c18"/>
      <stop offset="70%" stop-color="#552f11"/>
      <stop offset="100%" stop-color="#3b1d06"/>
    </linearGradient>

    <linearGradient id="goldHomeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5cf"/>
      <stop offset="30%" stop-color="#f5cd69"/>
      <stop offset="70%" stop-color="#b8832a"/>
      <stop offset="100%" stop-color="#6e4609"/>
    </linearGradient>

    <filter id="homeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Plaque carrée en bois aux coins arrondis -->
  <rect x="3" y="3" width="54" height="54" rx="11" fill="url(#woodHomeGrad)" stroke="url(#goldHomeGrad)" stroke-width="2.5" filter="url(#homeShadow)"/>
  <rect x="6" y="6" width="48" height="48" rx="8" fill="none" stroke="#2a1405" stroke-width="1.2" opacity="0.6"/>

  <!-- 4 petits rivets dorés aux coins -->
  <circle cx="9" cy="9" r="2" fill="url(#goldHomeGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="51" cy="9" r="2" fill="url(#goldHomeGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="9" cy="51" r="2" fill="url(#goldHomeGrad)" stroke="#381d06" stroke-width="0.8"/>
  <circle cx="51" cy="51" r="2" fill="url(#goldHomeGrad)" stroke="#381d06" stroke-width="0.8"/>

  <!-- Silhouette maison / riad en or ciselé au centre -->
  <g transform="translate(30, 30)">
    <!-- Toit en dôme / fronton traditionnel -->
    <path d="M-15 0 L0 -14 L15 0 Z" fill="url(#goldHomeGrad)" stroke="#452706" stroke-width="1.2"/>
    <!-- Débord de toit doré -->
    <path d="M-17 0.5 L0 -15 L17 0.5" fill="none" stroke="url(#goldHomeGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Corps du riad -->
    <rect x="-12" y="0" width="24" height="15" rx="1" fill="url(#goldHomeGrad)" stroke="#452706" stroke-width="1.2"/>

    <!-- Porte mauresque en arcade (arc en fer à cheval) -->
    <path d="M-4.5 15 V6 C-4.5 3 4.5 3 4.5 6 V15 Z" fill="#301705" stroke="#1c0c02" stroke-width="1"/>
    
    <!-- Rosace / fenêtre au-dessus de la porte -->
    <circle cx="0" cy="-5" r="2.4" fill="#301705" stroke="#1c0c02" stroke-width="0.8"/>
    <circle cx="0" cy="-5" r="1.1" fill="url(#goldHomeGrad)"/>

    <!-- Seuil de porte -->
    <line x1="-15" y1="15" x2="15" y2="15" stroke="url(#goldHomeGrad)" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
